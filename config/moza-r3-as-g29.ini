; Moza R3 presented to games as a Logitech G29.
; Axis indices are SDL's; run `wheelemu-service --config this.ini --print` and move each control to check them.

[emulator]
source_device = 346e            ; part of the wheel's name or its vid:pid from --list (346e = Moza; macOS names it "R3 Racing Wheel and Pedals")
target_profile = g29
state_port = 41329              ; UDP loopback port shared with the in-game shim
loop_hz = 1000

[steering]
axis = 0
source_rotation_deg = 900       ; set the same value in Moza Pit House
target_rotation_deg = 900       ; the G29 reports 900 degrees
deadzone = 0.0
invert = false

[throttle]
axis = 2                        ; checked with --ui: the throttle pedal moves SDL axis 2
invert = false
deadzone_low = 0.02
saturation_high = 0.98
gamma = 1.0

[brake]
axis = 5                        ; checked with --ui: the brake pedal moves SDL axis 5
invert = false
deadzone_low = 0.02
saturation_high = 0.95
gamma = 1.0

[clutch]
axis = 3
invert = false

[buttons]
; target_N = source button index, -1 to disable. Unlisted targets map 1:1.
; target_0 = 0

[ffb]
master_gain = 0.7
max_magnitude = 0.8             ; hard cap: the R3 is direct drive
max_slew_per_second = 25
invert = false                  ; set true if --ffb-test pushes the wrong way

[logging]
level = info                    ; trace | debug | info | warn | error | critical | off
; file = C:/wheelemu/wheelemu-service.log  ; default: per-user log folder. Dated daily: wheelemu-service-2026-09-30.log
console = true
flush_level = warn

[telemetry]
; Records the wheel, the mapping, what the game sees and the game's force feedback to two CSV files per
; day (telemetry-YYYY-MM-DD.csv, ffb-YYYY-MM-DD.csv) in the log folder. Every session of the day is appended
; to the same files. Local only, nothing is sent anywhere.
enabled = true
rate_hz = 50                    ; rows per second (1-1000)
max_file_mb = 500               ; recording stops for the day when a file reaches this size
; directory = D:/wheelemu-telemetry  ; default: the log folder

[retention]
; Logs (service and game) and telemetry older than older_than_days, checked at start-up and after midnight.
old_files = delete              ; delete | archive (compress each old day, then delete the originals) | keep
older_than_days = 7             ; today and the 7 days before it are never touched
archiver = auto                 ; for archive: auto = best one installed: 7z (7-Zip), xz, zstd, zip, gzip
