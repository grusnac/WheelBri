; Optional settings for the in-game shim. Copy next to dinput8.dll (the game's .exe folder).
; Without this file the defaults below are used.

[shim]
emulate = true                  ; false = only log, pass every device through unchanged
logi_log = false                ; true = log the game's calls into Logitech's SDK DLLs (debugging, 64-bit games)
source_vid = 346e               ; USB vendor id of your rig's wheel (the Rig tab shows it as vid:pid)
source_pid = any                ; or a 4-digit hex product id
target_profile = g920           ; the wheel to present: g25, g27, g920 or g923 (Start sets it: the Mapping tab's Target)
state_port = 41329              ; must match state_port in the service config
stale_after_ms = 1500           ; no data from the service this long = wheel centred, pedals released;
                                ; until then the last input is held, so a short service hiccup is not felt
force_feedback = service        ; service = through wheelbri-service's safety limiter (start it first);
                                ; passthrough = straight to the wheel's driver (only Pit House limits it);
                                ; off = the emulated wheel has no force feedback
ffb_port = 41330                ; must match ffb_port in the service config

; Which DirectInput axis the game reads each pedal from: x y z rx ry rz slider slider1 (clutch can be none).
; Leave commented out to use the target's layout (y / rz / slider; the G25's and G27's clutch slider1).
; throttle_axis = y
; brake_axis = rz
; clutch_axis = slider
invert_pedals = false           ; true = pressed and released swapped for every pedal

; Another mod's dinput8.dll WheelBri chained (renamed to dinput8-chain.dll): DirectInput goes on to it. WheelBri
; writes this line when it chains one; without it, straight to Windows' own.
; chain = dinput8-chain.dll
