; WheelBri's built-in config for the G25: the rig (the wheel and accessories set up in the Rig tab) presented to games
; as a Logitech G25 Racing Wheel (native mode, 046D:C299), in either mode: Virtual (WheelBri's virtual G25, every game
; sees it, the rig is hidden) or Shim (dinput8.dll next to the game's .exe). One mapping for both modes.
; The G25's axes, buttons and D-pad are fixed; what drives each of them is WheelBri's default mapping, which the
; Mapping tab changes (Save keeps the user's own as my-g25.ini; Default goes back to this). The order of the G25's
; buttons other than the gears is a guess until a real G25 is checked (docs/g25-target-plan.md).
; A source (axis = N, target_N = N, up = N) is the wheel's N, or vid:pid/N for an accessory's (pedals, shifter,
; button box; at most 3). Axis indices are the wheel's as the service numbers them; run
; `wheelbri-service --config this.ini --ui` and move each control to check them.

[emulator]
source_device =                 ; empty: the rig's wheel (Rig tab); or part of a wheel's name or its vid:pid from --list
target_profile = g25             ; the wheel WheelBri emulates (g920 or g25; the Mapping tab's Target)
state_port = 41329              ; UDP loopback port shared with the in-game shim
ffb_port = 41330                ; UDP loopback port the shim sends the game's force feedback to
state_rate_hz = 500             ; the game gets the state when it changed, at most this often (and every 100 ms)

[steering]
axis = 0
target_rotation_deg = 900       ; the steering rotation: set your wheel's own software (Pit House) to the same
invert = false
; No dead zones in WheelBri: every axis is used as the device reports it. Set dead zones in the device's own software
; (Pit House for Moza). Older configs' deadzone, deadzone_low and saturation_high lines are ignored.

[throttle]
axis = 2                        ; checked with --ui: the throttle pedal moves axis 2
invert = false
gamma = 1.0

[brake]
axis = 5                        ; checked with --ui: the brake pedal moves axis 5
invert = false
gamma = 1.0

[clutch]
axis = 6                        ; checked with telemetry: the clutch pedal moves axis 6
invert = false
gamma = 1.0

[buttons]
; target_N = source button index, -1 to disable. Unlisted targets map 1:1.
; N is the G25 button number shown in --ui (0-3 Black 1-4 on the shifter, 4 R Paddle, 5 L Paddle, 6 R Wheel,
; 7 L Wheel, 8-13 Gear 1-6 and 14 Gear R, 15-18 Red 1-4 on the shifter). The G25's D-pad is the shifter's (see [hat]).
; Buttons 4-7 are the wheel's D-pad (see [hat]), so they must not also drive G25 buttons 4-7.
; target_N_or = G25 button N's secondary sources (pressed while its own or any of these is), comma-separated, at
; most 8: buttons (20, vid:pid/20) and throttle, brake, clutch or handbrake axes past a threshold of their travel
; (axis 3 > 50%, vid:pid/axis 3 inverted > 40%). Each control is used once in a mapping (the Mapping tab sets these).
target_0 = 0                    ; G25 Black 1 <- rig button 0
target_1 = 1                    ; G25 Black 2 <- rig button 1
target_2 = 2                    ; G25 Black 3 <- rig button 2
target_3 = 3                    ; G25 Black 4 <- rig button 3
target_4 = 13                   ; G25 R Paddle <- rig button 13
target_5 = 12                   ; G25 L Paddle <- rig button 12
target_6 = 34                   ; G25 R Wheel <- rig button 34
target_7 = 21                   ; G25 L Wheel <- rig button 21
target_8 = -1                   ; G25 Gear 1 (its shifter): map your shifter's buttons to 8-14
target_9 = -1                   ; G25 Gear 2
target_10 = -1                  ; G25 Gear 3
target_11 = -1                  ; G25 Gear 4
target_12 = -1                  ; G25 Gear 5
target_13 = -1                  ; G25 Gear 6
target_14 = -1                  ; G25 Gear R (reverse)
target_15 = 35                  ; G25 Red 1 <- rig button 35
target_16 = 22                  ; G25 Red 2 <- rig button 22
target_17 = 24                  ; G25 Red 3 <- rig button 24
target_18 = 37                  ; G25 Red 4 <- rig button 37
target_19 = -1                  ; 19 and up: the G25 has no such buttons
target_20 = -1
target_21 = -1
target_22 = -1
target_23 = -1
target_24 = -1
target_25 = -1
target_26 = -1
target_27 = -1
target_28 = -1
target_29 = -1
target_30 = -1
target_31 = -1

[button_labels]
; What each of the wheel's buttons is called, shown next to its number in the --ui window and the app.
; button_N = name (at most 12 characters; the RIG BUTTONS grid shows the first 11). Display only.
; Find a button's number: press it with the window open, "Last pressed" names it.
button_0 = A
button_1 = B
button_2 = X
button_3 = Y
button_4 = Up                   ; rim D-pad (see [hat])
button_5 = Right
button_6 = Down
button_7 = Left
button_12 = L paddle
button_13 = R paddle
button_21 = Cam
button_22 = Radio
button_24 = Home
button_34 = R
button_35 = Start

[axis_labels]
; What each of the wheel's axes is called, shown in the Rig tab and the mapping view. axis_N = name (at most 12
; characters). Display only.
axis_0 = Wheel
axis_2 = Gas pedal
axis_5 = Brake pedal
axis_6 = Clutch pedal

[hat]
; The wheel reports its D-pad as four buttons; these turn them into the G25's D-pad.
up = 4
right = 5
down = 6
left = 7

[ffb]
master_gain = 0.7
max_magnitude = 0.8             ; hard cap: direct drive wheels are strong
max_slew_per_second = 50       ; full scale per second: 0 to 80% in 16 ms (a hard hit's delay)
frozen_force_s = 2             ; a push the game leaves unchanged this long (loading screen) fades out; 0 = never
invert = false                  ; set true if --ffb-test pushes the wrong way
game_effects = true             ; play the game's force feedback (through the limits above)

[logging]
level = warn                    ; trace | debug | info | warn | error | critical | off
; Only for wheelbri-service on its own (a console). The app (wheelbri.exe) ignores it: its Logs tab has a Level
; button (warn, info, debug, trace; warnings and errors are always written) that it remembers between starts.
; file = C:/Users/me/AppData/Local/wheelbri/logs/service.log  ; default: per-user log folder. Dated daily: service-2026-09-30.log
; Running as Administrator, a log file outside %LOCALAPPDATA%\wheelbri is ignored (with a warning).
console = true
flush_level = warn

[telemetry]
; Records the wheel, the mapping, what the game sees and the game's force feedback to two log files per
; run of the app and day (telemetry-YYYY-MM-DD-NN.log, ffb-YYYY-MM-DD-NN.log, NN = the run's number, as in its own
; log) in the log folder. Every session of a run is appended to the same files. Local only, nothing is sent anywhere.
enabled = true
rate_hz = 50                    ; at most this many rows per second (1-1000)
only_changes = true             ; a row only when a wheel, game or force feedback value changed
heartbeat_s = 60                ; ...and one row a minute anyway (0 = never)
min_change = 0.0005             ; smaller axis moves are sensor noise (0.0005 = 0.23 deg of steering)
max_file_mb = 500               ; recording stops for the day when a file reaches this size
; directory = C:/Users/me/AppData/Local/wheelbri/telemetry  ; default: the log folder (as Administrator: inside %LOCALAPPDATA%\wheelbri)

[retention]
; Logs (service and game) and telemetry older than older_than_days, checked at start-up and after midnight.
old_files = delete              ; delete | archive (compress each old day, then delete the originals) | keep
older_than_days = 2             ; today and the 2 days before it are never touched
archiver = auto                 ; for archive: auto = best one installed: 7z (7-Zip), xz, zstd, zip, gzip

; [game_settings]
; A game's own settings for its settings file, written only by Save to file on the Game profiles tab (with the game
; closed). Only to change a profile's value: <game profile id>.<setting id> = 0 to 1.
; nfsunbound.spring = 0.8          ; NFS Unbound's centring spring (WheelSpringMagnitude)

; [game_ffb_gain]
; A game's force feedback gain (its pushing forces times this while it runs), instead of its game profile's [ffb] gain
; (the Game profiles tab): <game profile id> = 0.25 to 4.
; nfsunbound = 3
