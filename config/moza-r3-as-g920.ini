; Moza R3 presented to games as a Logitech G920 (PC mode).
; Axis indices are SDL's; run `wheelemu-service --config this.ini --ui` and move each control to check them.

[emulator]
source_device = 346e            ; part of the wheel's name or its vid:pid from --list (346e = Moza; macOS names it "R3 Racing Wheel and Pedals")
target_profile = g920             ; or g29 (see config/moza-r3-as-g29.ini)
state_port = 41329              ; UDP loopback port shared with the in-game shim
ffb_port = 41330                ; UDP loopback port the shim sends the game's force feedback to
loop_hz = 1000

[steering]
axis = 0
source_rotation_deg = 900       ; set the same value in Moza Pit House
target_rotation_deg = 900       ; the G920 reports 900 degrees
deadzone = 0.0
invert = false

[throttle]
axis = 2                        ; checked with --ui: the throttle pedal moves SDL axis 2
invert = false
deadzone_low = 0.02
saturation_high = 0.98
gamma = 1.0

[brake]
axis = 5                        ; checked with --ui: the brake pedal moves SDL axis 5
invert = false
deadzone_low = 0.02
saturation_high = 0.95
gamma = 1.0

[clutch]
axis = 3
invert = false

[buttons]
; target_N = source button index, -1 to disable. Unlisted targets map 1:1.
; N is the G920 button number shown in --ui (0 A, 1 B, 2 X, 3 Y, 4 R paddle, 5 L paddle, 6 Menu, 7 View,
; 8 RSB, 9 LSB, 10 Xbox).
; R3 buttons 4-7 are the rim's D-pad (see [hat]), so they must not also drive G920 buttons 4-7.
target_4 = 13                   ; G920 R paddle (RB) <- R3 button 13
target_5 = 12                   ; G920 L paddle (LB) <- R3 button 12
target_6 = 35                   ; G920 Menu <- R3 button 35
target_7 = 22                   ; G920 View <- R3 button 22
target_22 = -1                  ; R3 22 is View now; stop it also pressing unlabelled button 22
target_8 = 34                   ; G920 RSB (right stick button) <- R3 button 34
target_9 = 21                   ; G920 LSB (left stick button) <- R3 button 21
target_10 = 24                  ; G920 Xbox button <- R3 button 24

[hat]
; The R3 rim reports its D-pad as four buttons; these turn them into the G920's D-pad.
up = 4
right = 5
down = 6
left = 7

[ffb]
master_gain = 0.7
max_magnitude = 0.8             ; hard cap: the R3 is direct drive
max_slew_per_second = 25
invert = false                  ; set true if --ffb-test pushes the wrong way
game_effects = true             ; play the game's force feedback (through the limits above)

[logging]
level = info                    ; trace | debug | info | warn | error | critical | off
; file = C:/wheelemu/service.log  ; default: per-user log directory
max_file_size_mb = 10
max_files = 5
console = true
flush_level = warn

[telemetry]
; Records the wheel, the mapping, what the game sees and the game's force feedback to two CSV files per
; session (telemetry-<date>.csv, ffb-<date>.csv) in the log folder. Local only, nothing is sent anywhere.
enabled = true
rate_hz = 50                    ; rows per second (1-1000)
max_file_mb = 200               ; recording stops when a file reaches this size
keep_sessions = 20              ; older sessions are deleted at start-up
; directory = D:/wheelemu-telemetry  ; default: the log folder
