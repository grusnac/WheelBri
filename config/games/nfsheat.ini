; WheelBri game profile: NFS Heat.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (see nfs2015.ini). This one changes
; nothing: it only says which target the game does not support.
;
; Why: NFS Heat came out before the G923 and has no button layout for it. Checked on a Moza R3 (2026-10-24, Mode
; Shim): as a G923 the game read the D-pad exactly (Logitech's wheel SDK handed it every press through LogiGetState)
; and did nothing with it; as a G920 the D-pad works. Real G923 owners report the same on EA's forum (no D-pad, no
; shifter, the wheel not named in the game's settings).

[game]
label = NFS Heat
program = NeedForSpeedHeat.exe
target = g920
not_for = g923
not_for_note = it has no layout for that wheel, so the D-pad does nothing
