; WheelBri game profile: NFS Payback.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (see nfs2015.ini). This one changes
; the steering rotation while the game runs; the user can change it in the Games tab.
;
; Why: NFS Payback's cars understeer and turn in slowly with a wheel, whatever the wheel (2026-10-11, a Moza R3 as the
; G920: Logitech's wheel SDK hands the game the steering exactly and at once, so the slowness is the game's; G29
; owners report the same on Steam). A small rotation helps: at 180 degrees full lock is 90 degrees each way, so the
; car responds to less turning. Set the same rotation in the wheel's own software, or the wheel
; turns on past the game's full lock and the force feedback drops there (2026-10-11: with the wheel at 360 and the
; game at 180, a quarter of a session was spent past full lock, the car not steering and the wheel slack).

[game]
label = NFS Payback
program = NeedForSpeedPayback.exe
target = g920

[steering]
; While the game runs: wheel and game full lock both 180 (the mapping's own rotation again when it ends).
rotation_deg = 180
note = its cars understeer and turn in slowly with a wheel, a small rotation helps
