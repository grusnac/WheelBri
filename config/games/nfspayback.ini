; WheelBri game profile: NFS Payback.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (see nfs2015.ini). This one changes
; nothing: it only gives advice, which the app shows and the user decides on.
;
; Why: NFS Payback's cars understeer and turn in slowly with a wheel, whatever the wheel (2026-10-11, a Moza R3 as the
; G920: Logitech's wheel SDK hands the game the steering exactly and at once, so the slowness is the game's; G29
; owners report the same on Steam). A small rotation helps: at 180 degrees full lock is 90 degrees each way, so the
; car responds to less turning. Set the same rotation in the wheel's own software (Pit House for Moza), or the wheel
; turns on past the game's full lock and the force feedback drops there.

[game]
label = NFS Payback
program = NeedForSpeedPayback.exe
target = g920

[steering]
; Advice only: shown in the Mapping tab (with a button that fills it in) and when the game runs with another rotation.
rotation_deg = 180
note = Its cars understeer and turn in slowly with a wheel. Set 180 here and in your wheel's own software.
