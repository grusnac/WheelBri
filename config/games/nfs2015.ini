; WheelBri game profile: NFS 2015.
;
; A game profile holds only what the game needs changed from WheelBri's defaults. It is laid over them like a sieve:
; every key set here replaces the default, every key left out keeps it. Most games need no profile at all.
;
; Built into WheelBri (compiled in from config/games/*.ini): nothing to install or set. Used for the G920 virtual device
; by wheelbri-service and for the G920 in-game shim by the shim itself, whenever the game's program runs.
;
; Why: NFS 2015 reads a G920's pedals from its own built-in table, which has them on other axes than a real G920
; reports them (2026-10-09: with a real G920's layout its gas was the brake; the shim's axis audit saw the game do
; nothing to the device, and real G920 owners report the same swap on EA's forum).

[game]
; Shown as it is in the window's status ("Running 1:23, NFS 2015") and the log: short, NFS for Need for Speed.
label = NFS 2015
program = nfs16.exe
; The target the profile was checked with (target_profile); with another target the profile is not used.
target = g920

[pedals]
; Which DirectInput axis the game reads each pedal from. The G920's defaults: throttle y, brake rz, clutch slider.
throttle_axis = slider
brake_axis = y
clutch_axis = rz
