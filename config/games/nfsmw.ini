; WheelBri game profile: NFS Most Wanted (2005). Its program is speed.exe, as NFS Underground's (nfsu1.ini): a
; speed.exe without Underground's marker next to it is Most Wanted.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (nfs2015.ini says how it is laid over
; them). Built into WheelBri (compiled in from config/games/*.ini): nothing to install or set.
;
; Why: the game reads up/down in its menus and the throttle and brake from one axis (Y), as Logitech's "Report
; Combined Pedals" gives it. With separate pedals a released throttle holds Y at its end and the menus scroll by
; themselves; with combined pedals menus and driving work (2026-11-10, Windows 7, Mode Shim, G25).

[game]
; Shown as it is in the window's status ("Running 1:23, NFS MW") and the log.
label = NFS MW
program = speed.exe
; Combined pedals mean the same on every target.
target = any

[pedals]
; Logitech's "Report Combined Pedals": throttle and brake on the throttle's axis, the brake's axis in the middle.
combined = true
