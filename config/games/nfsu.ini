; WheelBri game profile: NFS Underground and NFS Most Wanted (2005); both games' program is speed.exe.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (nfs2015.ini says how it is laid over
; them). Built into WheelBri (compiled in from config/games/*.ini): nothing to install or set.
;
; Why: both games read up/down in their menus and the throttle and brake from one axis (Y), as Logitech's "Report
; Combined Pedals" gives it. With separate pedals a released throttle holds Y at its end and the menus scroll by
; themselves (2026-11-10, Windows 7, Mode Shim, G25: the shim's log shows Y at its end with the pedals released; real
; Logitech owners report the same and turned on combined pedals).

[game]
; Shown as it is in the window's status ("Running 1:23, NFS U1/MW") and the log: short, NFS for Need for Speed.
label = NFS U1/MW
program = speed.exe
; Combined pedals mean the same on every target.
target = any

[pedals]
; Logitech's "Report Combined Pedals": throttle and brake on the throttle's axis, the brake's axis in the middle.
combined = true
