; WheelBri game profile: NFS Unbound.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (see nfs2015.ini). This one sets the
; game's own wheel force feedback settings (hidden: its menus show none) and makes its pushing forces stronger.
;
; Why: NFS Unbound's force feedback is very light and the game has no setting for it (G920 owners say the same). With
; the virtual G920 on a Moza R3 (2026-10-12) its steering force averaged 5% of full scale and peaked at 18%; its
; centring spring was 0 most of the time. After the usual gain (0.7) that is under 4% at the wheel: nothing to feel.
; NFS 2015 averages 17%. The gain multiplies only what pushes (the steering force and the kerb and drift rumble); the
; game's damper and spring stay as they are. The cap (max_magnitude, 80%) and the slew limit still apply.

[game]
label = NFS Unbound
program = NeedForSpeedUnbound.exe
target = g920

[ffb]
gain = 3
note = its force feedback is very light and the game has no setting for it

[game_settings]
; Its wheel settings live in its settings file, not in its menus: WheelFFBMagnitude (all of it), WheelTireForcesMagnitude
; (the steering force), WheelSpringMagnitude (the centring spring), WheelDamperMagnitude, WheelSurfaceMagnitude,
; WheelCollisionMagnitude (0.5 each by default), WheelMaxRotation (270) and WheelDeadzone (0). With everything at 0.5
; its forces are light (2026-10-12: with WheelFFBMagnitude and WheelSpringMagnitude at 1.0 its centring spring, 0
; before, went to 75-99% and its steering force up by half). WheelBri writes these while the game is closed; the
; Mapping tab (PER GAME) changes them.
file = Need For Speed(TM) Unbound/settings/PROFILEOPTIONS
note = the game has no wheel settings in its menus; these are its hidden ones
force_feedback = WheelFFBMagnitude 1.0
spring = WheelSpringMagnitude 0.8
rotation = WheelMaxRotation steering   ; its PER GAME rotation in the Mapping tab ([game_rotation] nfsunbound), else the mapping's
