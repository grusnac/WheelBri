; WheelBri game profile: NFS Unbound.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (see nfs2015.ini). This one sets the
; game's own wheel force feedback settings (hidden: its menus show none).
;
; Its force feedback is light: with the virtual G920 on a Moza R3 (2026-10-12) its steering force averaged 5% of full
; scale and peaked at 18% (NFS 2015 averages 17%). WheelBri passes it as the game sends it (gain 1):
; how strong is the wheel's own app's to set. For more in this game only, raise its Steering force and Vibration in
; the Games tab (up to 4 times what it asks).

[game]
label = NFS Unbound
program = NeedForSpeedUnbound.exe
target = g920
; Checked on a Moza R3 (2026-10-18, Mode Shim): as a G923 the game falls back to a layout for wheels it does not know.
not_for = g923
not_for_note = it uses a layout for wheels it does not know: A opens the friend list, buttons do other things

[game_settings]
; Its wheel settings live in its settings file, not in its menus: WheelFFBMagnitude (all of it), WheelTireForcesMagnitude
; (the steering force), WheelSpringMagnitude (the centring spring), WheelDamperMagnitude, WheelSurfaceMagnitude,
; WheelCollisionMagnitude (0.5 each by default), WheelMaxRotation (270) and WheelDeadzone (0). With everything at 0.5
; its forces are light (2026-10-12: with WheelFFBMagnitude and WheelSpringMagnitude at 1.0 its centring spring, 0
; before, went to 75-99% and its steering force up by half). The Games tab changes them and writes them into
; the file (Save to file, with the game closed); WheelBri never writes them by itself.
file = Need For Speed(TM) Unbound/settings/PROFILEOPTIONS
note = the game has no wheel settings in its menus; these are its hidden ones
force_feedback = WheelFFBMagnitude 1.0
spring = WheelSpringMagnitude 0.8
rotation = WheelMaxRotation steering   ; its rotation in the Games tab ([game_rotation] nfsunbound), else the mapping's
