; WheelBri game profile: NFS Underground 2.
;
; A game profile holds only what the game needs changed from WheelBri's defaults (nfs2015.ini says how it is laid over
; them). Built into WheelBri (compiled in from config/games/*.ini): nothing to install or set.
;
; Why: from the same years as NFS Underground (nfsu.ini), made for wheels with combined pedals. With separate pedals
; (2026-11-10, Windows 7, Mode Shim, G25) its button bindings went wrong while released pedals sat at their ends; the
; Linux openforspeed project combines the pedals for it too. Not yet tested with combined pedals.

[game]
; Shown as it is in the window's status ("Running 1:23, NFS U2") and the log.
label = NFS U2
program = speed2.exe
; Combined pedals mean the same on every target.
target = any

[pedals]
; Logitech's "Report Combined Pedals": throttle and brake on the throttle's axis, the brake's axis in the middle.
combined = true
