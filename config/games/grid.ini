; WheelBri game profile: Race Driver: GRID (2008).
;
; A game profile holds only what the game needs changed from WheelBri's defaults (nfs2015.ini says how it is laid over
; them). Built into WheelBri (compiled in from config/games/*.ini): nothing to install or set.
;
; Why: GRID's G25 preset (ActionMap/actionMapPreset1.xml in the game's folder) puts the replay controls on the keyboard
; only (F1, F7, F8, F12, Escape), so a flashback cannot be taken from the wheel. [game_files] adds the wheel's buttons
; to those actions (measured in the game, 2026-11-22: they work), and the menu actions GRID's own Xbox 360 wheel
; preset (actionMapPreset6.xml) has. The user adds and removes them all at once in the Games tab (FileValueMap.hpp).

[game]
; Shown as it is in the window's status and the log.
label = Race Driver: GRID
program = grid.exe
; The preset file below is the G25's (GRID picks it by the wheel's name).
target = g25

[game_files]
; Relative to the game's folder. One line per insert: <parent> | <position> | <value>, in the file's own style.
file = ActionMap/actionMapPreset1.xml
note = Replay controls (flashback too) and menu buttons on the G25's buttons
insert.1 = Action[actionName=Replay Pause] | end | <Axis axisName = "win_con_di_button17" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.1.note = A (black, bottom) pauses and resumes a replay and a flashback. The keyboard's F1 still does too.
insert.2 = Action[actionName=Replay Jump In] | end | <Axis axisName = "win_con_di_button16" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.2.note = X (black, left) jumps back into the race from the replay: the flashback. The keyboard's F12 still does too.
insert.3 = Action[actionName=Replay Next Camera] | end | <Axis axisName = "win_con_di_button4" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.3.note = The right paddle shows the replay from the next camera. The keyboard's F8 still does too.
insert.4 = Action[actionName=Replay Prev Camera] | end | <Axis axisName = "win_con_di_button5" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.4.note = The left paddle shows the replay from the camera before. The keyboard's F7 still does too.
insert.5 = Action[actionName=Replay Exit] | end | <Axis axisName = "win_con_di_button15" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.5.note = Y (black, top) leaves the replay. The keyboard's Escape still does too.
insert.6 = Action[actionName=Replay Exit] | end | <Axis axisName = "win_con_di_button3" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.6.note = Red 4 leaves the replay too (the button the Keys preset sends Enter with on the start screen).
insert.7 = Action[actionName=Replay Rewind] | end | <Axis axisName = "win_con_di_axisDPad0left" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.7.note = D-pad left rewinds the replay while held. The keyboard's F2 still does too.
insert.8 = Action[actionName=Replay Fast Forward] | end | <Axis axisName = "win_con_di_axisDPad0right" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" />
insert.8.note = D-pad right fast-forwards the replay while held. The keyboard's F3 still does too.
insert.9 = ActionMap | end | <Action actionName = "Menu Start Button" ><Axis axisName = "win_con_di_button3" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" /></Action>
insert.9.note = New action (as the Xbox 360 wheel preset has it): Red 4 as the menus' Start button. It does not make the start screen react (measured): the Keys tab sends Enter for that.
insert.10 = ActionMap | end | <Action actionName = "Menu Back Button" ><Axis axisName = "win_con_di_button2" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" /></Action>
insert.10.note = New action (as the Xbox 360 wheel preset has it): Red 3 as the menus' Back button. What the game does with it on the G25 is not measured.
insert.11 = ActionMap | end | <Action actionName = "Temp Left Shoulder" ><Axis axisName = "win_con_di_button5" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" /></Action>
insert.11.note = New action (as the Xbox 360 wheel preset has it): the left paddle as the left shoulder button, which pages menus left on a pad. Not measured on the G25.
insert.12 = ActionMap | end | <Action actionName = "Temp Right Shoulder" ><Axis axisName = "win_con_di_button4" deviceName = "Logitech G25 Racing Wheel USB" baseCalibration = "uniDirectionalPositive" /></Action>
insert.12.note = New action (as the Xbox 360 wheel preset has it): the right paddle as the right shoulder button, which pages menus right on a pad. Not measured on the G25.
